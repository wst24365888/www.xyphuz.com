<!doctype html>
<html lang="en" class="mode-gate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Xyphuz — Software Architect</title>
    <meta name="description" content="Xyphuz (Hsing-Han Wu) — software architect building enterprise systems for giga-fab semiconductor manufacturing and the cloud infrastructure under them. The whole site is a live-rendered film." />
    <meta name="theme-color" content="#050506" />
    <meta property="og:title" content="Xyphuz — Software Architect" />
    <meta property="og:description" content="Software architect · Enterprise systems · Cloud infrastructure." />
    <meta property="og:url" content="https://www.xyphuz.com" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
      <canvas id="ov" role="img" aria-label="A live-rendered film about Xyphuz: software engineer, software architect, enterprise systems at giga-fab scale, and cloud infrastructure."></canvas>
    </div>

    <!-- shared top bar -->
    <header class="bar">
      <button class="brand" id="brand" type="button" aria-label="Xyphuz — home">
        <img src="favicon.svg" alt="" width="34" height="34" />
        <span>XYPHUZ</span>
      </button>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="actions">
        <button class="pill" id="sound" type="button" aria-pressed="false">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl">Sound off</span>
        </button>
        <button class="pill" id="replay" type="button">↺ <span class="lbl">Replay</span></button>
        <button class="pill" id="skip" type="button">Skip <span aria-hidden="true">→</span></button>
      </div>
    </header>

    <!-- entry gate -->
    <section class="gate" id="gate" aria-label="Enter">
      <p class="kicker">XYPHUZ — A LIVE-RENDERED FILM · 30 S</p>
      <h1>Software architect.<br /><em>Enterprise systems, cloud infrastructure,</em><br />and a soft spot for motion.</h1>
      <div class="gate-cta">
        <button class="cta" id="enter-sound" type="button"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Enter with sound</button>
        <button class="ghost" id="enter-quiet" type="button">Enter without sound</button>
      </div>
      <button class="link" id="enter-site" type="button">or skip the film →</button>
      <p class="loading" id="loading">Warming up the GPU…</p>
    </section>

    <!-- the film's progress -->
    <div class="progress" id="progress" aria-hidden="true"><i id="progress-fill"></i></div>

    <!-- the interactive site the film turns into -->
    <section class="panel" id="panel" aria-live="polite">
      <p class="kicker" id="p-kicker"></p>
      <h2 id="p-title"></h2>
      <p class="body" id="p-body"></p>
      <ul class="tags" id="p-tags"></ul>
      <div class="links">
        <a href="https://github.com/wst24365888" rel="noopener">GitHub ↗</a>
        <a href="mailto:xyphuzwu@gmail.com">xyphuzwu@gmail.com ↗</a>
      </div>
    </section>
    <p class="hint" id="hint"><span class="desk">Drag to orbit · click to scatter · ← → to switch</span><span class="touch">Drag to orbit · tap to scatter</span></p>

    <script src="mark3d.js"></script>
    <script src="engine.js"></script>
    <script src="shapes.js"></script>
    <script src="reel.js"></script>
    <script src="audio.js"></script>
    <script src="main.js"></script>
  </body>
</html>
