<!doctype html>
<html lang="en" class="mode-gate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Xyphuz — Software Architect</title>
    <meta name="description" content="Xyphuz (Hsing-Han Wu) — software architect building enterprise systems for giga-fab semiconductor manufacturing and the cloud infrastructure under them. The whole site is a live-rendered film." />
    <meta name="theme-color" content="#050506" />
    <meta property="og:title" content="Xyphuz — Software Architect" />
    <meta property="og:description" content="Software architect · Enterprise systems · Cloud infrastructure." />
    <meta property="og:url" content="https://www.xyphuz.com" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=10" />
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
      <canvas id="ov" role="img" aria-label="A live-rendered film about Xyphuz: software engineer, software architect, enterprise systems at giga-fab scale, and cloud infrastructure."></canvas>
    </div>

    <!-- shared top bar -->
    <header class="bar">
      <button class="brand" id="brand" type="button" aria-label="Xyphuz — home">
        <img src="favicon.svg" alt="" width="34" height="34" />
        <span>XYPHUZ</span>
      </button>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="actions">
        <button class="pill icon" id="sound" type="button" aria-pressed="false" aria-label="Sound">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" /><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" /><path d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          <span class="lbl">Sound off</span>
        </button>
        <button class="pill icon" id="replay" type="button" aria-label="Replay the film">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /><path d="M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span class="lbl">Replay</span>
        </button>
        <button class="pill" id="skip" type="button">Skip <span aria-hidden="true">→</span></button>
      </div>
    </header>

    <!-- countdown into the film -->
    <section class="gate" id="gate" aria-label="The film starts in a moment">
      <p class="kicker">XYPHUZ — A LIVE-RENDERED FILM · 30 S</p>
      <div class="count" aria-live="polite">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" /><circle id="count-ring" cx="60" cy="60" r="54" /></svg>
        <span id="count-num"></span>
      </div>
      <p class="loading" id="loading">Warming up the GPU…</p>
      <p class="sound-hint" id="sound-hint">Sound is off — <b>tap anywhere</b> to turn it on</p>
    </section>

    <!-- the film's progress -->
    <div class="progress" id="progress" aria-hidden="true"><i id="progress-fill"></i></div>

    <!-- the interactive site the film turns into -->
    <section class="panel" id="panel" aria-live="polite">
      <p class="kicker" id="p-kicker"></p>
      <h2 id="p-title"></h2>
      <p class="body" id="p-body"></p>
      <p class="try" id="p-hint"></p>
      <ul class="tags" id="p-tags"></ul>
      <div class="links">
        <a href="https://github.com/wst24365888" rel="noopener">GitHub ↗</a>
        <a href="mailto:xyphuzwu@gmail.com">xyphuzwu@gmail.com ↗</a>
      </div>
    </section>
    <script src="mark3d.js?v=10"></script>
    <script src="engine.js?v=10"></script>
    <script src="shapes.js?v=10"></script>
    <script src="reel.js?v=10"></script>
    <script src="audio.js?v=10"></script>
    <script src="main.js?v=10"></script>
  </body>
</html>
