server {
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types text/css application/javascript image/svg+xml;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# the site is several scripts that must always match each other after a deploy:
	# revalidate every load (cheap 304s via ETag) instead of caching blind
	location ~* \.(js|css|svg|html)$ {
		add_header Cache-Control "no-cache";
	}
}
